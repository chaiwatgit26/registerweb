<h1>Register</h1>

<form (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="firstName">First Name</label>
    <input id="firstName"
           name="firstName"
           type="text"
           [(ngModel)]="formData.firstName">
  </div>

  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input id="lastName"
           name="lastName"
           type="text"
           [(ngModel)]="formData.lastName">
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email"
           name="email"
           type="email"
           [(ngModel)]="formData.email">
  </div>

  <div class="form-group">
    <label for="phone">Phone</label>
    <input id="phone"
           name="phone"
           type="text"
           [(ngModel)]="formData.phone">
  </div>

  <div class="form-group">
    <label for="birthDate">Birth Date</label>
    <input id="birthDate"
           name="birthDate"
           type="date"
           [(ngModel)]="formData.birthDate">
  </div>

  <div class="form-group">
    <label for="occupation">Occupation</label>

    <select id="occupation"
            name="occupation"
            [(ngModel)]="formData.occupationId">

      <option [ngValue]="0">-- Select Occupation --</option>
      <option [ngValue]="1">Developer</option>
      <option [ngValue]="2">Programmer</option>
      <option [ngValue]="3">Tester</option>
      <option [ngValue]="4">System Analyst</option>
      <option [ngValue]="5">Other</option>

    </select>
  </div>

  <div class="form-group">
    <label>Sex</label>

    <div class="radio-group">

      <label>
        <input type="radio"
               name="sex"
               value="Male"
               [(ngModel)]="formData.sex">
        Male
      </label>

      <label>
        <input type="radio"
               name="sex"
               value="Female"
               [(ngModel)]="formData.sex">
        Female
      </label>

    </div>
  </div>

  <div class="form-group">
    <label for="profile">Profile</label>

    <textarea id="profile"
              name="profile"
              rows="4"
              [(ngModel)]="formData.profile">
    </textarea>
  </div>

  <button type="submit">Register</button>

</form>
